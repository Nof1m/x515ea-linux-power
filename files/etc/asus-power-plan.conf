# /etc/asus-power-plan.conf
#
# Limites por perfil. O perfil é escolhido no KDE (ou com powerprofilesctl)
# e o daemon lê /sys/firmware/acpi/platform_profile:
#
#   Economia de energia -> quiet       -> plano "eco"
#   Equilibrado         -> balanced    -> plano "balanced"
#   Desempenho          -> performance -> plano "gaming"
#
# Ajuste em passos pequenos e valide com: sudo asus-power-plan status

# ---- Economia de energia (quiet) -------------------------------------------
ECO_PL1_W=12
ECO_PL2_W=20
ECO_MAX_MHZ=2400
ECO_TCC=20              # 80 °C

# ---- Equilibrado (balanced) -------------------------------------------------
BAL_PL1_W=15
BAL_PL2_W=25
BAL_MAX_MHZ=3000
BAL_TCC=15              # 85 °C

# ---- Desempenho / jogos (performance) ---------------------------------------
PERF_PL1_W=22
PERF_PL2_W=28
PERF_MAX_MHZ=3200
PERF_TCC=15             # 85 °C

# ---- Ajuste automático na bateria (só para balanced/gaming) -----------------
BAT_PL1_DROP_W=3
BAT_MAX_DROP_MHZ=400
BAT_MIN_PL1_W=12
BAT_MIN_MAX_MHZ=2000
